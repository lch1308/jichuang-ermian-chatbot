    <div id="root"></div>

    <div id="heart-voice-control" style="position:fixed;right:18px;top:16px;z-index:1002;width:260px;max-width:calc(100vw - 36px);pointer-events:auto">
      <button id="heart-voice-toggle" type="button" disabled style="width:100%;padding:10px 12px;border:2px solid #34d399;border-radius:10px;background:#065f46;color:white;font:600 15px/1.4 system-ui">语音控制加载中…</button>
      <div id="heart-voice-hint" style="font:11px/1.5 system-ui;color:white;text-align:center">若持续未加载，请重新使用桌面 Live2D 启动入口。</div>
      <div id="heart-asr-service" role="status" style="font:12px/1.6 system-ui;color:white">语音输入：正在检查本地识别…</div>
      <div id="heart-voice-service" role="status" style="font:11px/1.5 system-ui;color:white;text-align:center"></div>
    </div>
